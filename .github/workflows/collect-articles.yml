name: collect-articles

# 매일 새벽(한국시간 01:17, 예비 05:43)에 뉴스 사이트를 돌며 새 기사를 구글 시트(Raw_Articles)에 쌓는다.
# GitHub 예약 작업은 붐비는 시간(정각, 한국 아침)에 몇 시간씩 늦어지므로 새벽의 정각이 아닌 분으로 잡았다.
# 두 번 돌아도 같은 기사는 중복 제거되어 한 번만 쌓인다 (예비 실행은 첫 실행이 늦거나 실패할 때 대비).
# 필요한 값: 저장소 Settings → Secrets and variables → Actions → Repository secrets
#   SHEETS_WEBAPP_URL, SHEETS_WEBAPP_TOKEN   (시트에 붙인 Apps Script 웹 앱 주소와 토큰, 무료)
#   서비스 계정 방식을 쓴다면 GOOGLE_SHEETS_SPREADSHEET_ID, GOOGLE_SERVICE_ACCOUNT_KEY_JSON
on:
  schedule:
    - cron: "17 16 * * *" # 한국시간 01:17
    - cron: "43 20 * * *" # 한국시간 05:43 (예비)
  workflow_dispatch:
    inputs:
      days:
        description: "최근 며칠 기사까지 수집할지"
        default: "14"

permissions:
  contents: read

concurrency:
  group: collect-articles
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect articles into Google Sheets
        env:
          STORE_MODE: sheets
          DATA_DIR: ${{ runner.temp }}/tdl-mi
          SHEETS_WEBAPP_URL: ${{ secrets.SHEETS_WEBAPP_URL }}
          SHEETS_WEBAPP_TOKEN: ${{ secrets.SHEETS_WEBAPP_TOKEN }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_JSON }}
          DAYS: ${{ inputs.days }}
        run: npm run collect -- "${DAYS:-14}"
      - name: Public logistics indicators (FRED, free)
        # 트렌드 인사이트 페이지의 공개 지표. 실패해도 기사 수집 결과에는 영향 없음
        continue-on-error: true
        env:
          STORE_MODE: sheets
          DATA_DIR: ${{ runner.temp }}/tdl-mi
          SHEETS_WEBAPP_URL: ${{ secrets.SHEETS_WEBAPP_URL }}
          SHEETS_WEBAPP_TOKEN: ${{ secrets.SHEETS_WEBAPP_TOKEN }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_JSON }}
        run: npm run indicators
